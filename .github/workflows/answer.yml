name: Answer new quiz rounds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Solve any unanswered rounds
        run: python solve.py
      - name: Commit and push new answers
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add answers/
          if git diff --cached --quiet; then
            echo "Nothing new to submit."
          else
            git commit -m "Answers: $(git diff --cached --name-only | sed 's#answers/##' | tr '\n' ' ')"
            git pull --rebase
            git push
          fi
